spring.application.name=docmate
server.port=8081

# Thymeleaf????????????HTML???????
spring.thymeleaf.cache=false

# DevTools????????????
spring.devtools.livereload.enabled=true

spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

spring.datasource.url=jdbc:postgresql://localhost:5432/docmate
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ??????UTF-8???
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ???????????UTF-8???
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# アップロードできる1ファイルの最大サイズ
spring.servlet.multipart.max-file-size=10MB

# 1回のリクエスト全体の最大サイズ
spring.servlet.multipart.max-request-size=12MB

# AI要約の実行モード
# fake: 開発用の仮AI要約
# openai: 実際のOpenAI API要約
ai.summary.provider=fake

# AI書類レビューの実行モード
# fake: 開発用の仮AIレビュー
# openai: 実際のOpenAI APIレビュー
ai.review.provider=fake

# OpenAI API設定
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4.1-mini