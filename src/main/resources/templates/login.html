<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | DocMate</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "Noto Sans JP", sans-serif;
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1f2937;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            padding: 40px 32px;
        }

        .badge {
            display: block;
            width: fit-content;
            margin: 0 auto 14px;
            padding: 6px 12px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 30px;
            font-weight: 700;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 28px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .alert {
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .alert-error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .bottom-text {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
            line-height: 1.7;
        }

        .bottom-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .demo-box {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            color: #475569;
            line-height: 1.7;
        }

        .home-link {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        .home-link a {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
        }

        .home-link a:hover {
            color: #2563eb;
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="login-container">

    <span class="badge">DocMate Career Support</span>

    <div class="logo">DocMate</div>

    <div class="subtitle">
        応募書類を安全に管理するポートフォリオWebサービス
    </div>

    <!-- ログイン失敗時のメッセージを表示する -->
    <div th:if="${param.error}" class="alert alert-error">
        ユーザー名またはパスワードが正しくありません。
    </div>

    <!-- ログアウト成功時のメッセージを表示する -->
    <div th:if="${param.logout}" class="alert alert-success">
        ログアウトしました。
    </div>

    <!-- 会員登録成功時のメッセージを表示する -->
    <div th:if="${param.signupSuccess}" class="alert alert-success">
        会員登録が完了しました。ログインしてください。
    </div>

    <!-- Spring Security の /login へ POST 送信する -->
    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="username">ユーザー名</label>
            <!-- Spring Security の認証で使用するため、name属性は username にする -->
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="ユーザー名を入力してください"
                   required>
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>
            <!-- Spring Security の認証で使用するため、name属性は password にする -->
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="パスワードを入力してください"
                   required>
        </div>

        <button type="submit" class="login-btn">
            ログインする
        </button>
    </form>

    <div class="bottom-text">
        アカウントをお持ちでない場合は、
        <a th:href="@{/signup}">会員登録</a>
        してください。
    </div>

    <div class="demo-box">
        <strong>ご利用について</strong><br>
        会員登録したアカウントでログインすると、応募書類のアップロード・一覧確認・ダウンロード・削除を利用できます。
    </div>

    <div class="home-link">
        <a th:href="@{/}">トップページへ戻る</a>
    </div>

</div>
</body>
</html>
