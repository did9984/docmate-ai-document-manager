<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録 | DocMate</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Noto Sans JP", sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
        }

        .signup-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        .badge {
            display: block;
            width: fit-content;
            margin: 0 auto 14px;
            padding: 6px 12px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .signup-title {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #2563eb;
        }

        .signup-subtitle {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.7;
        }

        .alert {
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .alert-error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .signup-button {
            width: 100%;
            padding: 13px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .signup-button:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
            line-height: 1.7;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .note-box {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            color: #475569;
            line-height: 1.7;
        }

        .home-link {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        .home-link a {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
        }

        .home-link a:hover {
            color: #2563eb;
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="signup-container">

    <span class="badge">DocMate Career Support</span>

    <div class="signup-title">DocMate</div>

    <div class="signup-subtitle">
        応募書類を管理するためのアカウントを作成します。
    </div>

    <!-- 会員登録エラー時のメッセージを表示する -->
    <div th:if="${errorMessage}" class="alert alert-error">
        <span th:text="${errorMessage}">
            会員登録に失敗しました。
        </span>
    </div>

    <!-- 入力した会員情報を /signup へ送信する -->
    <form th:action="@{/signup}" method="post">

        <div class="form-group">
            <label for="username">ユーザー名</label>
            <!-- 登録するユーザー名を入力する -->
            <input id="username"
                   type="text"
                   name="username"
                   placeholder="ユーザー名を入力してください"
                   required>
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>
            <!-- 登録するパスワードを入力する -->
            <input id="password"
                   type="password"
                   name="password"
                   placeholder="パスワードを入力してください"
                   required>
        </div>

        <button type="submit" class="signup-button">
            会員登録する
        </button>
    </form>

    <div class="login-link">
        すでにアカウントをお持ちの場合は、
        <a th:href="@{/login}">ログイン</a>
        してください。
    </div>

    <div class="note-box">
        <strong>ご利用について</strong><br>
        会員登録後、ログインすると応募書類のアップロード・一覧確認・ダウンロード・削除を利用できます。
    </div>

    <div class="home-link">
        <a th:href="@{/}">トップページへ戻る</a>
    </div>

</div>
</body>
</html>
